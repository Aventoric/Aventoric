<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel | AVENTORIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card">
        <div class="brand">AVENTORIC</div>
        <p class="muted">Panel de gestión de solicitudes</p>
        <label>Contraseña
            <input type="password" id="password" autocomplete="current-password" required autofocus>
        </label>
        <button class="btn primary" type="submit">Ingresar</button>
        <p id="login-error" class="error" role="alert"></p>
        <a class="muted small" href="/">← Volver al sitio</a>
    </form>
</section>

<!-- APP -->
<div id="app-view" hidden>
    <header class="topbar">
        <div class="brand">AVENTORIC <span>Panel</span></div>
        <div class="top-actions">
            <span id="last-sync" class="muted small"></span>
            <a class="btn" id="export-btn" href="/api/admin/export.csv">Exportar CSV</a>
            <button class="btn" id="logout-btn" type="button">Salir</button>
        </div>
    </header>

    <main class="wrap">
        <section class="kpis" id="kpis" aria-label="Resumen"></section>

        <section class="toolbar">
            <input type="search" id="f-q" placeholder="Buscar por nombre, empresa, correo, referencia o detalle…" aria-label="Buscar">
            <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option></select>
            <select id="f-tipo" aria-label="Tipo"><option value="">Todos los tipos</option></select>
            <select id="f-prioridad" aria-label="Prioridad"><option value="">Toda prioridad</option></select>
            <div class="seg" role="group" aria-label="Vista">
                <button type="button" id="v-lista" class="on">Lista</button>
                <button type="button" id="v-tablero">Tablero</button>
            </div>
        </section>

        <section id="list-view" class="table-wrap"></section>
        <section id="board-view" class="board" hidden></section>
        <p id="empty" class="empty" hidden>No hay solicitudes con esos filtros.</p>
    </main>

    <!-- DETALLE -->
    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-label="Detalle de la solicitud">
        <header class="drawer-head">
            <div><div id="d-ref" class="ref"></div><h2 id="d-title"></h2><div id="d-tipo" class="muted small"></div></div>
            <button id="d-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
        </header>
        <div class="drawer-body">
            <div class="grid2">
                <label>Estado<select id="d-estado"></select></label>
                <label>Prioridad<select id="d-prioridad"></select></label>
            </div>
            <label>Responsable<input id="d-responsable" type="text" maxlength="80" placeholder="Nombre de quien gestiona"></label>

            <h3>Contacto</h3>
            <dl class="facts" id="d-facts"></dl>

            <h3>Solicitud</h3>
            <p id="d-detalle" class="detalle"></p>

            <h3>Seguimiento</h3>
            <form id="note-form" class="note-form">
                <textarea id="note-text" rows="3" maxlength="2000" placeholder="Agregar una nota de seguimiento (llamada, propuesta, acuerdo…)"></textarea>
                <button class="btn primary" type="submit">Agregar nota</button>
            </form>
            <ol id="d-notas" class="timeline"></ol>

            <button id="d-delete" class="btn danger" type="button">Eliminar solicitud</button>
        </div>
    </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="admin.js"></script>
</body>
</html>
